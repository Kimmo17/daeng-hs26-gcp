<text y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13"><tspan x="530" fill="#bc4c00" font-weight="700">①</tspan><tspan x="578" fill="#bc4c00" font-weight="700">Luzern, Brüelstrasse</tspan><tspan x="802" fill="#bc4c00" font-weight="700">155</tspan></text>
<text x="866.0" y="91.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">am nächsten</text>
<path d="M516 100 H1028" stroke="#d0d7de"/>
<text y="119" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13"><tspan x="530" fill="#1a7f37" font-weight="700">②</tspan><tspan x="578" fill="#1a7f37" font-weight="700">Luzern, Verkehrshaus/Lido</tspan><tspan x="802" fill="#1a7f37" font-weight="700">163</tspan></text>
<text x="866.0" y="119.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">steht in der Datei</text>
<path d="M516 128 H1028" stroke="#d0d7de"/>
<text y="147" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13"><tspan x="530" fill="#0969da" font-weight="700">③</tspan><tspan x="578" fill="#0969da" font-weight="700">Luzern, Brüel</tspan><tspan x="802" fill="#0969da" font-weight="700">166</tspan></text>
<rect x="516" y="172" width="512" height="170" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<path d="M516 202 V178 a6 6 0 0 1 6 -6 H1022 a6 6 0 0 1 6 6 V202 Z" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="530.0" y="192.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="700">Was die Abfrage rechnet, alles in BigQuery</text>
<text x="530.0" y="221.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="start" font-weight="400">location_type = '1'</text>
<text x="720.0" y="221.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">nur Stationen, keine einzelnen Kanten</text>
<path d="M516 230 H1028" stroke="#d0d7de"/>
<text x="530.0" y="249.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="start" font-weight="400">ST_GEOGPOINT(lon, lat)</text>
<text x="720.0" y="249.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">aus zwei Zahlen wird ein Punkt</text>
<path d="M516 258 H1028" stroke="#d0d7de"/>
<text x="530.0" y="277.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="start" font-weight="400">ST_DWITHIN(a, b, 200)</text>
<text x="720.0" y="277.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">nur Paare im Umkreis von 200 m</text>
<path d="M516 286 H1028" stroke="#d0d7de"/>
<text x="530.0" y="305.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="start" font-weight="400">ST_DISTANCE(a, b)</text>
<text x="720.0" y="305.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">Luftlinie zwischen zwei Punkten, in Metern</text>
<path d="M516 314 H1028" stroke="#d0d7de"/>
<text x="530.0" y="333.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="start" font-weight="400">ROW_NUMBER()</text>
<text x="720.0" y="333.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">Rang pro Bahnhof, 1 ist der nächste</text>
<text x="518.0" y="370.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">Nur 8 m Unterschied: Am nächsten liegt Brüelstrasse, zum Bahnhof</text>
<text x="518.0" y="388.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="400">gehört Verkehrshaus/Lido. Die Abfrage schlägt vor, ein Mensch wählt aus.</text>
</svg>
