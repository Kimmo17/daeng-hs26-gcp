<text y="64" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" font-weight="700" fill="#8c959f"><tspan x="530">rang</tspan><tspan x="578">nachbar</tspan><tspan x="802">meter</tspan></text>
