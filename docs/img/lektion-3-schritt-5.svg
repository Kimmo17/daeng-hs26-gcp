<text x="238.7" y="209.4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#bc4c00" text-anchor="start" font-weight="700">155 m</text>
<path d="M258 251 L363.9 312.1" stroke="#1a7f37" stroke-width="1.5"/>
<text x="301.9" y="300.6" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="700">163 m</text>
<path d="M258 251 L156.0 322.4" stroke="#0969da" stroke-width="1.5"/>
<text x="197.0" y="284.7" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#0969da" text-anchor="end" font-weight="700">166 m</text>
<circle cx="191.3" cy="155.8" r="6" fill="#bc4c00" stroke="#ffffff" stroke-width="1.5"/>
<text x="191.3" y="139.8" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#bc4c00" text-anchor="middle" font-weight="700">① Luzern, Brüelstrasse</text>
<circle cx="363.9" cy="312.1" r="6" fill="#1a7f37" stroke="#ffffff" stroke-width="1.5"/>
<text x="353.9" y="336.1" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1a7f37" text-anchor="middle" font-weight="700">② Luzern, Verkehrshaus/Lido</text>
<circle cx="156.0" cy="322.4" r="6" fill="#0969da" stroke="#ffffff" stroke-width="1.5"/>
<text x="152.0" y="346.4" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="700">③ Luzern, Brüel</text>
<circle cx="419.0" cy="138.3" r="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
<text x="433.0" y="160.3" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#8c959f" text-anchor="middle" font-weight="400">weiter als 200 m:</text>
<text x="433.0" y="175.3" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#8c959f" text-anchor="middle" font-weight="400">fällt weg</text>
<rect x="251" y="244" width="14" height="14" fill="#1f2328" stroke="#ffffff" stroke-width="1.5"/>
<text x="272.0" y="243.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="700">Bahnhof</text>
<text x="272.0" y="259.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="700">Luzern Verkehrshaus</text>
<text x="30.0" y="444.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#8c959f" text-anchor="start" font-weight="400">Schema: Distanzen massstäblich, Richtungen frei gewählt.</text>
