<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 602" width="1044" height="602" role="img" aria-labelledby="t d">
<title id="t">Wie die Abfrage den nächsten Nachbarn eines Bahnhofs findet</title>
<desc id="d">Um den Bahnhof Luzern Verkehrshaus liegt ein Kreis von 200 Metern. Darin liegen drei Stationen: Luzern, Brüelstrasse in 155 Metern, Luzern, Verkehrshaus/Lido in 163 Metern und Luzern, Brüel in 166 Metern. Die Datei vbl_bahnhoefe.csv enthält nur Namen. Die Position des Bahnhofs steht in raw.stops und wird über den Namen gefunden. Eine Station ausserhalb des Kreises fällt weg. Die Abfrage ordnet die drei nach Distanz. Am nächsten ist Brüelstrasse, in der Datei steht Verkehrshaus/Lido.</desc>
