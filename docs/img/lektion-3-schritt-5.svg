<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 472" width="1044" height="472" role="img" aria-labelledby="t d">
<title id="t">Wie die Abfrage den nächsten Nachbarn eines Bahnhofs findet</title>
<desc id="d">Um den Bahnhof Luzern Verkehrshaus liegt ein Kreis von 200 Metern. Darin liegen drei Stationen: Luzern, Brüelstrasse in 155 Metern, Luzern, Verkehrshaus/Lido in 163 Metern und Luzern, Brüel in 166 Metern. Eine Station ausserhalb des Kreises fällt weg. Die Abfrage ordnet die drei nach Distanz. Am nächsten ist Brüelstrasse, in der Datei steht Verkehrshaus/Lido.</desc>
<rect width="1044" height="472" fill="#ffffff"/>
<rect x="16" y="16" width="484" height="440" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<path d="M16 46 V22 a6 6 0 0 1 6 -6 H494 a6 6 0 0 1 6 6 V46 Z" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="30.0" y="36.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="700">Bahnhof Luzern Verkehrshaus und seine Nachbarn</text>
<circle cx="258" cy="251" r="150" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="258.0" y="92.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#8c959f" text-anchor="middle" font-weight="400">Umkreis von 200 m</text>
