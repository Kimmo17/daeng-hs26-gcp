<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 538" width="1044" height="538" role="img" aria-labelledby="t d">
<title id="t">Von den Rohzeilen zur Stufe, und wer wo entscheidet</title>
<desc id="d">Oktober 2026: 544 Zeilen in raw.alerts werden zu 321 Meldungen in stg_alerts. Eine Regel wählt 19 davon für das Sprachmodell aus. Das Modell liest jede genau einmal und füllt 19 Zeilen in int_alerts_extracted. Eine Regel in SQL vergibt die Stufen: 4 Ersatzverkehr prüfen, 13 Planungshinweis, 2 keine.</desc>
<rect width="1044" height="538" fill="#ffffff"/>
<rect x="16" y="16" width="1012" height="506" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<path d="M16 46 V22 a6 6 0 0 1 6 -6 H1022 a6 6 0 0 1 6 6 V46 Z" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="30.0" y="36.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="13.5" fill="#1f2328" text-anchor="start" font-weight="700">Von den Rohzeilen zur Stufe: wer wo entscheidet, mit den Zahlen für den Oktober 2026</text>
<rect x="30.0" y="66" width="500" height="44" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="280.0" y="84.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="700">raw.alerts</text>
<text x="280.0" y="101.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">544 Zeilen, jede Aktualisierung ist eine eigene Zeile</text>
<path d="M280 116 V144" stroke="#8c959f" stroke-width="2.5"/>
<path d="M280 154 l-7 -11 h14 z" fill="#8c959f"/>
<path d="M296 135.0 H526" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 4"/>
<text x="566.0" y="129.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="700">Staging räumt auf</text>
<text x="566.0" y="145.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Pro Meldung bleibt nur die neueste Fassung.</text>
<rect x="90.0" y="160" width="380" height="44" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="280.0" y="178.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="700">stg_alerts</text>
<text x="280.0" y="195.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">321 Meldungen, je die neueste Fassung</text>
<path d="M280 210 V238" stroke="#1f2328" stroke-width="2.5"/>
<path d="M280 248 l-7 -11 h14 z" fill="#1f2328"/>
<path d="M296 229.0 H526" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="544" cy="229.0" r="11" fill="#1f2328"/>
<text x="544.0" y="233.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">1</text>
<text x="566.0" y="215.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="700">Eine Regel sortiert vor</text>
<text x="566.0" y="231.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Nur Störungen, die einen Bahnhof aus der Seed-Tabelle nennen.</text>
<text x="566.0" y="247.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Alles andere kann Luzern nicht betreffen, und jeder Aufruf kostet.</text>
<rect x="135.0" y="254" width="290" height="44" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="280.0" y="272.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="700">Vorauswahl</text>
<text x="280.0" y="289.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">19 Meldungen gehen an das Sprachmodell</text>
<path d="M280 304 V332" stroke="#8250df" stroke-width="2.5"/>
<path d="M280 342 l-7 -11 h14 z" fill="#8250df"/>
<path d="M296 323.0 H526" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="544" cy="323.0" r="11" fill="#1f2328"/>
<text x="544.0" y="327.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">2</text>
<text x="566.0" y="309.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#8250df" text-anchor="start" font-weight="700">Das Sprachmodell liest jede Meldung genau einmal</text>
<text x="566.0" y="325.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Zwei Aufrufe liefern nicht immer dasselbe.</text>
<text x="566.0" y="341.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Was in der Tabelle steht, bleibt. Sie ist inkrementell.</text>
<rect x="135.0" y="348" width="290" height="44" rx="6" fill="#f6f8fa" stroke="#8c959f"/>
<text x="280.0" y="366.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="middle" font-weight="700">int_alerts_extracted</text>
<text x="280.0" y="383.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="middle" font-weight="400">19 Zeilen mit Ursache, Abschnitt und Zeiten</text>
<path d="M280 398 V426" stroke="#1f2328" stroke-width="2.5"/>
<path d="M280 436 l-7 -11 h14 z" fill="#1f2328"/>
<path d="M296 417.0 H526" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="544" cy="417.0" r="11" fill="#1f2328"/>
<text x="544.0" y="421.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle" font-weight="700">3</text>
<text x="566.0" y="403.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#1f2328" text-anchor="start" font-weight="700">Die Stufe vergibt eine Regel in SQL</text>
<text x="566.0" y="419.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Sie fragt, wo die Störung liegt, was ausfällt und wie lange.</text>
<text x="566.0" y="435.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">Die Mindestdauer ist eine Zahl, kein Prompt.</text>
<rect x="53.0" y="442" width="170" height="62" rx="6" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/>
<text x="138.0" y="470.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" fill="#bc4c00" text-anchor="middle" font-weight="700">4</text>
<text x="138.0" y="491.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#bc4c00" text-anchor="middle" font-weight="700">Ersatzverkehr prüfen</text>
<rect x="235.0" y="442" width="150" height="62" rx="6" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
<text x="310.0" y="470.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" fill="#0969da" text-anchor="middle" font-weight="700">13</text>
<text x="310.0" y="491.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#0969da" text-anchor="middle" font-weight="700">Planungshinweis</text>
<rect x="397.0" y="442" width="110" height="62" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="452.0" y="470.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="22" fill="#8c959f" text-anchor="middle" font-weight="700">2</text>
<text x="452.0" y="491.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12.5" fill="#8c959f" text-anchor="middle" font-weight="700">keine</text>
<text x="566.0" y="470.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13" fill="#1f2328" text-anchor="start" font-weight="700">alert_decisions</text>
<text x="566.0" y="488.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="12" fill="#1f2328" text-anchor="start" font-weight="400">19 Zeilen, eine Stufe pro Meldung, mit Begründung</text>
</svg>
