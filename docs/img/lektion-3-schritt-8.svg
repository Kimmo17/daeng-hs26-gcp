<text x="892.0" y="186.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#1f2328" text-anchor="middle" font-weight="400">mal Dauer durch 24</text>
<text x="30.0" y="218.0" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif" font-size="11.5" fill="#8c959f" text-anchor="start" font-weight="400">Beispiel: die Meldung Olten - Luzern. Der Wortlaut hängt von deinem erzeugten Code ab, die Teile sind dieselben.</text>
