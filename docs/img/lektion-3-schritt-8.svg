<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1044 248" width="1044" height="248" role="img" aria-labelledby="t d">
<title id="t">Der Satz in reason und woher seine Teile kommen</title>
<desc id="d">Beispiel: Ausfall im Abschnitt: 26 Linien an Luzern, Bahnhof, 3.1 Stunden, etwa 393 Fahrten betroffen. Ausfall und die Dauer kommen vom Sprachmodell. Im Abschnitt kommt vom Sprachmodell und von der Seed-Tabelle. Die Linien an der Haltestelle kommen aus der Seed-Tabelle und dem Fahrplan. Die Fahrten kommen aus dem Mart von Lektion 2.</desc>
