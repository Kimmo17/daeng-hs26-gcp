# Workflow gtfs-pipeline mit Triage (Lektion 4): dieselbe Pipeline wie in workflow.yaml, mit
# einem Unterschied. Scheitert ein Schritt, startet der Workflow den Job triage mit seiner
# eigenen Execution-ID und wirft den Fehler danach weiter. Die Execution scheitert also wie
# vorher, der Alarm aus Lektion 2 schickt wie vorher seine E-Mail, aber wenn die E-Mail ankommt,
# liegt in ops.incidents schon eine Diagnose.
#
# Wird unter demselben Namen deployt wie workflow.yaml (gtfs-pipeline), der Scheduler und der
# Alarm bleiben, wie sie sind. Die Schritte zwischen init und done sind unverändert, nur in
# einen try-Block gerückt.
#
# Was der Workflow dem Agenten gibt: eine ID. Nicht den Fehlertext, nicht eine Vermutung. Der
# Agent liest selbst, was er braucht, und das Programm im Job wartet, bis die Execution beendet
# ist, denn in dem Moment, in dem der except-Zweig läuft, ist sie noch ACTIVE.

main:
  steps:
    - init:
        assign:
          - project: ${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          - location: ${sys.get_env("GOOGLE_CLOUD_LOCATION")}
          # Die ID dieser Execution. Das ist alles, was der Agent bekommt.
          - execution_id: ${sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}
          - ingest_job: "ingest-gtfs"
          - transform_job: "transform-gtfs"
          - triage_job: "triage"
          - quality_scan: "trips-quality"
          - scan_job: null

    - pipeline:
        try:
          steps:
            - run_ingest:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + project + "/locations/" + location + "/jobs/" + ingest_job}
                  connector_params:
                    timeout: 3600
                result: ingest_execution

            - run_quality_scan:
                call: http.post
                args:
                  url: ${"https://dataplex.googleapis.com/v1/projects/" + project + "/locations/" + location + "/dataScans/" + quality_scan + ":run"}
                  auth:
                    type: OAuth2
                result: scan_run

            - wait_for_scan:
                for:
                  value: poll
                  range: [1, 60]
                  steps:
                    - get_scan_job:
                        call: http.get
                        args:
                          url: ${"https://dataplex.googleapis.com/v1/" + scan_run.body.job.name}
                          query:
                            view: FULL
                          auth:
                            type: OAuth2
                        result: scan_response
                    - remember_scan_job:
                        assign:
                          - scan_job: ${scan_response.body}
                    - stop_when_finished:
                        switch:
                          - condition: ${scan_job.state in ["SUCCEEDED", "FAILED", "CANCELLED"]}
                            next: break
                    - pause:
                        call: sys.sleep
                        args:
                          seconds: 15

            - check_gate:
                switch:
                  - condition: ${scan_job.state != "SUCCEEDED" or not(default(map.get(scan_job, ["dataQualityResult", "passed"]), false))}
                    steps:
                      - init_failed_rules:
                          assign:
                            - failed_rules: []
                      - collect_failed_rules:
                          for:
                            value: rule_result
                            in: ${default(map.get(scan_job, ["dataQualityResult", "rules"]), [])}
                            steps:
                              - remember_if_failed:
                                  switch:
                                    - condition: ${not(default(map.get(rule_result, "passed"), false))}
                                      steps:
                                        - add_rule:
                                            assign:
                                              - failed_rules: ${list.concat(failed_rules, rule_result.rule.name)}
                      - stop_pipeline:
                          raise: '${"Qualitätsschranke geschlossen. Scan-Job " + scan_job.name + ", Zustand " + scan_job.state + ", nicht bestandene Regeln: " + json.encode_to_string(failed_rules)}'

            - run_transform:
                call: googleapis.run.v2.projects.locations.jobs.run
                args:
                  name: ${"projects/" + project + "/locations/" + location + "/jobs/" + transform_job}
                  connector_params:
                    timeout: 1800
                result: transform_execution

            - done:
                return:
                  ingest_execution: ${ingest_execution.response.name}
                  scan_job: ${scan_job.name}
                  passed: ${scan_job.dataQualityResult.passed}
                  transform_execution: ${transform_execution.response.name}

        # Hierhin kommt jeder Fehler aus den Schritten oben: der 403 des Connectors, die
        # geschlossene Qualitätsschranke, ein dbt-Test. e ist der Fehler selbst.
        except:
          as: e
          steps:
            - start_triage:
                # Den Job starten und nicht auf ihn warten (skip_polling). Die Execution-ID geht
                # als Argument an den Container, dort landet sie in sys.argv. Das Argument ist
                # ein Override, dafür braucht workflow-sa auf dem Job triage die Rolle
                # roles/run.jobsExecutorWithOverrides, Invoker reicht nicht.
                # Eigener try-Block: scheitert der Start der Triage, darf das den eigentlichen
                # Fehler nicht verdecken. Dann steht eine Warnung im Log, und der Alarm kommt trotzdem.
                try:
                  call: googleapis.run.v2.projects.locations.jobs.run
                  args:
                    name: ${"projects/" + project + "/locations/" + location + "/jobs/" + triage_job}
                    body:
                      overrides:
                        containerOverrides:
                          - args: ["${execution_id}"]
                    connector_params:
                      skip_polling: true
                  result: triage_operation
                except:
                  as: triage_error
                  steps:
                    - log_triage_error:
                        call: sys.log
                        args:
                          severity: WARNING
                          # Einfache Anführungszeichen, weil YAML ": " sonst als Schlüssel liest.
                          text: '${"Triage nicht gestartet: " + json.encode_to_string(triage_error)}'
            - rethrow:
                # Der ursprüngliche Fehler, unverändert. So scheitert die Execution wie in Lektion 2,
                # und der Alarm sieht keinen Unterschied.
                raise: ${e}
